# Alert rules for the BMI app. Prometheus evaluates them every 30 s; firing alerts go
# to Alertmanager. See them: Grafana -> Alerting -> Alert rules, or Prometheus /alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bmi-app
spec:
  groups:
    - name: bmi-app
      rules:
        - alert: BmiBackendDown
          expr: sum(up{namespace="bmi-app", service="bmi-backend-svc"}) < 1 or absent(up{namespace="bmi-app", service="bmi-backend-svc"})
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No BMI backend pod is answering /metrics
            description: Check `kubectl -n bmi-app get pods` and the backend logs in Grafana Explore (Loki).

        - alert: BmiHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="bmi-app", status_code=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="bmi-app"}[5m])) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of BMI API requests fail with 5xx
            description: 'Error ratio is {{ $value | humanizePercentage }}.'

        - alert: BmiHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="bmi-app"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: BMI API p95 latency above 1 s
            description: 'p95 is {{ $value | humanizeDuration }}.'

        - alert: BmiPostgresVolumeFilling
          expr: |
            kubelet_volume_stats_available_bytes{namespace="bmi-app", persistentvolumeclaim="data-postgres-0"}
              / kubelet_volume_stats_capacity_bytes{namespace="bmi-app", persistentvolumeclaim="data-postgres-0"} < 0.15
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: Postgres volume has less than 15% free space
            description: Resize PVC data-postgres-0 (the gp3 StorageClass allows expansion).
