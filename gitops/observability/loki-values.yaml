# Values for the loki chart (Argo CD app gitops/argocd/apps/loki.yaml).
# Single binary: one pod does ingest + query + compaction, with its data on a gp3 EBS
# volume. Good for a few GB of logs per day. For more, switch to SimpleScalable + S3
# (see docs, "Move Loki to S3").
deploymentMode: SingleBinary

loki:
  auth_enabled: false                 # single tenant ("fake"); no X-Scope-OrgID header needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h            # keep logs 7 days
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true           # the compactor deletes chunks older than retention_period
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true                     # "Patterns" tab in Grafana Explore / Logs Drilldown

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp3
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# Everything below is for the scalable modes or extras we don't need.
write: { replicas: 0 }
read: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }           # Alloy and Grafana talk to the loki Service directly
chunksCache: { enabled: false }       # memcached; asks for several GiB of memory by default
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }

# Let Prometheus scrape Loki itself (ingest rate, errors).
monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
