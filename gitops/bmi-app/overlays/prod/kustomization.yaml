# Production values. scripts/00-configure.sh fills the double-underscore placeholders once
# (or edit them by hand - see docs/01-console-guide.md). After that the only
# lines that change are the two 'newTag' values (scripts/03-release.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: bmi-backend
    newName: __ACCOUNT_ID__.dkr.ecr.__REGION__.amazonaws.com/__CLUSTER__/bmi-backend
    newTag: initial
  - name: bmi-frontend
    newName: __ACCOUNT_ID__.dkr.ecr.__REGION__.amazonaws.com/__CLUSTER__/bmi-frontend
    newTag: initial

patches:
  - target: { kind: ConfigMap, name: backend-config }
    patch: |
      - op: replace
        path: /data/FRONTEND_URL
        value: https://__APP_HOST__
  - target: { kind: Ingress, name: bmi }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: __APP_HOST__
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: __CERT_ARN__
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1group.name
        value: __CLUSTER__
