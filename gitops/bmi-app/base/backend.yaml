# Tier 2 - Node.js API. Image and FRONTEND_URL are set by the overlay.
# Needs Secret 'backend-secret' (DATABASE_URL) - created outside Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  NODE_ENV: "production"
  PORT: "3000"
  FRONTEND_URL: "https://app.example.com"     # patched by the overlay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # No 'replicas' here: the HPA owns it (otherwise Argo CD self-heal and the HPA fight).
  selector:
    matchLabels: { app: bmi-backend }
  template:
    metadata:
      labels: { app: bmi-backend }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: bmi-backend } }
      containers:
        - name: bmi-backend
          image: bmi-backend                    # replaced by the overlay 'images:' block
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: { name: backend-secret }
            - configMapRef: { name: backend-config }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bmi-backend-svc        # nginx.conf proxies /api to this name
  labels: { app: bmi-backend } # the ServiceMonitor selects the Service by this label
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector: { app: bmi-backend }
  ports:
    - name: http               # the ServiceMonitor scrapes this port by name (/metrics)
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bmi-backend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bmi-backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
