# Public HTTPS entry: ALB -> frontend pods. Host and certificate are set by the overlay.
# ExternalDNS reads spec.rules[].host and creates the Route 53 record automatically.
# group.name (set to the cluster name by the overlay): the Argo CD and Grafana Ingresses join the same ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bmi
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: set-by-overlay
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: set-by-overlay
spec:
  ingressClassName: alb
  rules:
    - host: app.example.com                     # patched by the overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bmi-frontend-svc
                port:
                  number: 80
