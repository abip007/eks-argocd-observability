# Tier 1 - React SPA on nginx (nginx proxies /api to bmi-backend-svc).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels: { app: bmi-frontend }
  template:
    metadata:
      labels: { app: bmi-frontend }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: bmi-frontend } }
      containers:
        - name: bmi-frontend
          image: bmi-frontend                   # replaced by the overlay 'images:' block
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bmi-frontend-svc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector: { app: bmi-frontend }
  ports:
    - port: 80
      targetPort: 80
