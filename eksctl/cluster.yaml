# yaml-language-server: $schema=https://raw.githubusercontent.com/eksctl-io/eksctl/main/pkg/apis/eksctl.io/v1alpha5/assets/schema.json
# eksctl cluster definition (used by scripts/01-create-cluster.sh).
# Double-underscore placeholders are filled by scripts/00-configure.sh.
# eksctl builds the VPC (3 AZs, public + private subnets, already tagged for
# ALBs), the control plane, the add-ons and a private managed node group.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: __CLUSTER__
  region: __REGION__
  version: "__K8S_VERSION__"
  tags:
    managed-by: eksctl
    project: eks-argocd-observability

vpc:
  cidr: __VPC_CIDR__
  nat:
    gateway: Single              # HighlyAvailable = one NAT per AZ (~3x cost)
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  # publicAccessCIDRs: ["203.0.113.10/32"]   # lock the API to your IP

accessConfig:
  authenticationMode: API        # EKS access entries, no aws-auth ConfigMap

addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: kube-proxy
  - name: coredns
  - name: eks-pod-identity-agent
  - name: metrics-server         # kubectl top + the backend HPA (Prometheus is separate)
  - name: aws-ebs-csi-driver     # volumes for Postgres, Prometheus, Loki, Alertmanager
    podIdentityAssociations:
      - namespace: kube-system
        serviceAccountName: ebs-csi-controller-sa
        permissionPolicyARNs:
          - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

# Controller permissions via EKS Pod Identity. The policies are created from
# policies/*.json by scripts/01-create-cluster.sh before eksctl runs.
iam:
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      permissionPolicyARNs:
        - arn:aws:iam::__ACCOUNT_ID__:policy/__CLUSTER__-lbc
    - namespace: external-dns
      serviceAccountName: external-dns
      permissionPolicyARNs:
        - arn:aws:iam::__ACCOUNT_ID__:policy/__CLUSTER__-external-dns

managedNodeGroups:
  - name: general
    amiFamily: AmazonLinux2023
    instanceType: __NODE_TYPE__
    minSize: __NODE_MIN__
    desiredCapacity: __NODE_DESIRED__
    maxSize: __NODE_MAX__
    volumeSize: 20
    privateNetworking: true      # nodes in private subnets, egress via NAT
    labels: { role: general }

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
